name = "fund-nav-sync"
main = "index.js"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "api.yourpower.today", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1

# Rotating slice sync hourly (one slice/hour; all funds fully refreshed every nSlices hours)
[triggers]
crons = ["0 * * * *"]
