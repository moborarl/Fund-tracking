# Cloudflare Pages Static Deployment Configuration
# For: Fund Tracking Dashboard

name = "fund-tracking-dashboard"
compatibility_date = "2024-01-01"

# Build settings for Pages (static files)
[build]
command = ""
output_dir = "."

# Environment variables (optional - for future API integration)
[env.production]
vars = { API_ENDPOINT = "https://api.finnomena.com", NAV_REFRESH_INTERVAL = "3600" }

[env.development]
vars = { API_ENDPOINT = "http://localhost:3000", NAV_REFRESH_INTERVAL = "60" }

# NOTE: This is simplified for static Pages hosting
# If using Workers for API proxying, create separate wrangler.toml for Worker
